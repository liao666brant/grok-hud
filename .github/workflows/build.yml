name: Build and release

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, test and verify the Windows package
        shell: pwsh
        run: ./scripts/build.ps1 -OutputDirectory artifacts
      - name: Verify release tag matches the package
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content grok-hud/plugin.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package versions differ.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: artifacts/*
          if-no-files-found: error
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, test and verify the Linux package
        shell: bash
        run: |
          ./scripts/build.sh artifacts
          version=$(jq -r '.version' grok-hud/plugin.json)
          if [ "${GITHUB_REF_NAME:-}" != "v$version" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo 'Tag and package versions differ.' >&2; exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64
          path: artifacts/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x64
          path: artifacts
      - name: Publish verified release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content grok-hud/plugin.json -Raw | ConvertFrom-Json).version
          # Stable asset names let install.sh resolve releases/latest/download.
          foreach ($platform in @('windows-x64', 'linux-x64')) {
            $source = Join-Path 'artifacts' "GrokHUD-$version-$platform.zip"
            if (Test-Path -LiteralPath $source) {
              $stable = Join-Path 'artifacts' "GrokHUD-$platform.zip"
              Copy-Item -LiteralPath $source -Destination $stable -Force
              $hash = (Get-FileHash -LiteralPath $stable -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  GrokHUD-$platform.zip" | Set-Content -LiteralPath "$stable.sha256" -Encoding ascii
            }
          }
          $assets = @(Get-ChildItem artifacts -File | ForEach-Object FullName)
          gh release view $env:GITHUB_REF_NAME --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Grok HUD $version" --notes-file CHANGELOG.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
